[package]
name = "research_agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Reflective multi-agent research assistant (planner, research, writer, editor) for local OpenAI-compatible LLMs and SearXNG, with a live web UI"
authors = ["Andreas Scheller"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AScheller/research_agent"
readme = "README.md"
keywords = ["agent", "llm", "research", "searxng", "rag"]
categories = ["web-programming::http-server", "science"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
